[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "option-feature-contracts"
version = "0.1.0a1"
requires-python = ">=3.12,<3.13"
description = "Pure option-native records, validation and canonical identities"
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
option_feature_contracts = ["_build_identity.json"]
