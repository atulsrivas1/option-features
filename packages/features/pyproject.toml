[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "option-features"
version = "0.1.0a1"
requires-python = ">=3.12,<3.13"
description = "Supplied-fact option calculations"
license = {file = "LICENSE"}
dependencies = ["option-feature-contracts==0.1.0a1", "python-flint==0.9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
option_features = ["_build_identity.json"]
